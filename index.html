<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ローマ字タイピングゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- パスワード画面 -->
  <div id="loginScreen">
    <h1>ローマ字タイピング</h1>
    <p>パスワードを入力してください</p>

    <input
      id="passwordInput"
      type="password"
      placeholder="パスワード"
    >

    <button id="loginButton">ログイン</button>

    <p id="loginMessage"></p>
  </div>

  <!-- ゲーム本体 -->
  <div id="siteContent" class="hidden">
    <main class="container">
      <h1>ローマ字タイピング</h1>

      <section id="stageSelect">
        <h2>ステージを選択</h2>
        <div id="stageList"></div>
      </section>

      <section id="game" class="hidden">
        <h2 id="stageTitle"></h2>

        <div class="info">
          <span>
            問題
            <b id="questionNumber">1 / 1</b>
          </span>

          <span>
            正解
            <b id="correctCount">0</b>
          </span>

          <span>
            ミス
            <b id="missCount">0</b>
          </span>
        </div>

        <!-- 日本語の問題文 -->
        <p id="question"></p>

        <!-- ローマ字入力欄 -->
        <input
          id="answerInput"
          type="text"
          placeholder="ローマ字で入力してください"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >

        <p id="progress"></p>
        <p id="message"></p>

        <button id="backButton">
          ステージ選択に戻る
        </button>
      </section>
    </main>
  </div>

  <script src="stages.js"></script>
  <script src="script.js"></script>
  <script src="login.js"></script>
</body>
</html>
